[package]
name = "kepler-releases"
version = "0.9.0"
edition = "2021"
description = "Static file server and signed release manifest endpoint for the Kepler website."
license = "MPL-2.0"

[[bin]]
name = "kepler-releases"
path = "src/main.rs"

# No dependencies on purpose. If you can't audit it in an afternoon,
# it has no business serving a security tool's download page.
[dependencies]

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
